name: Tennis Auto Upload

# 마감된 테니스 경기를 시트 업로드 + 아카이브한다.
#
# 트리거 구성 (2026-08-31 정리):
#  1차  — 맥북 launchd(com.mongpiece.tennis-auto-upload, 매일 10:00 KST)가 gh CLI로 workflow_dispatch 호출.
#         기존 gh 인증을 재사용해 새 토큰이 필요 없다. 대신 맥북이 자고 있으면 깨어난 뒤에 실행되고
#         (실측 2026-08-31: 10:00 예정 → 11:11 실행), 맥북을 켜지 않은 날은 실행되지 않는다.
#  백업  — 아래 schedule. GitHub cron은 실측 5~11시간 지연되고 누락되는 날도 있지만, 맥북과 무관하게
#         서버에서 돌기 때문에 "맥북이 꺼진 날"의 유일한 경로다. 이미 아카이브된 경기는 재처리되지
#         않으므로(resolveWithArchiveState) 늦게 돌거나 1차와 겹쳐 돌아도 안전하다.
#
# cron을 0분/30분 두 줄로 두었었으나 둘 다 똑같이 지연돼 하루 2회 실행만 늘 뿐이라 한 줄로 줄였다.
# Apps Script 시간 트리거(triggerTennisAutoUpload) 코드가 apps-script/Code.js에 있으나 설치하지 않았다 —
# GitHub PAT 발급·관리 부담 때문(유저 결정). 정시성이 더 필요해지면 그때 설치한다.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 아무것도 쓰지 않고 처리 대상만 출력한다"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tennis-auto-upload
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 자동 업로드·아카이브 실행
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          TENNIS_BOT_TOKEN: ${{ secrets.TENNIS_BOT_TOKEN }}
          # 정기 실행은 실제 처리, 수동 실행은 입력값(기본 true=미리보기)을 따른다.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: npx vite-node scripts/tennisAutoUpload.mjs
